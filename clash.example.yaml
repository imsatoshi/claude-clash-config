# EXAMPLE ONLY: replace placeholders locally before importing.
mode: rule
ipv6: false
mixed-port: 7897
allow-lan: false
bind-address: 127.0.0.1
log-level: info
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
  strict-route: false
proxies:
- name: Japan-Upstream
  type: vless
  server: upstream.example.invalid
  port: 443
  uuid: REPLACE_WITH_UPSTREAM_UUID
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: REPLACE_WITH_UPSTREAM_SERVER_NAME
  client-fingerprint: chrome
  reality-opts:
    public-key: REPLACE_WITH_REALITY_PUBLIC_KEY
    short-id: REPLACE_WITH_REALITY_SHORT_ID
- name: Dedicated-ISP
  type: socks5
  server: isp.example.invalid
  port: 443
  username: REPLACE_WITH_ISP_USERNAME
  password: REPLACE_WITH_ISP_PASSWORD
  udp: false
  dialer-proxy: Japan-Upstream
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Japan-Upstream
- name: Claude-ISP
  type: select
  proxies:
  - Dedicated-ISP
find-process-mode: always
listeners:
- name: claude-code-isp
  type: http
  listen: 127.0.0.1
  port: 17898
  proxy: Claude-ISP
rules:
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- GEOIP,private,DIRECT,no-resolve
- DOMAIN-SUFFIX,local,DIRECT
- DOMAIN-SUFFIX,lan,DIRECT
